# Netlify configuration
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache content-hashed assets (Vite emits `index-<hash>.js` style filenames
# under /assets/ — safe to cache forever).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must stay revalidated on every visit so deploys propagate
# immediately (the hashed asset URLs inside it are what changes on each build).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
