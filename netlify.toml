# Netlify configuration
[build]
  # NOTHING SHOULD EVER RUN THIS COMMAND. It is a tripwire, not a build.
  #
  # This site is compiled exclusively by the `deploy` job in
  # .github/workflows/ci.yml, which builds with the VITE_* repository variables
  # and then uploads the finished `dist`. Any *other* build of this repo runs
  # without those variables, and Vite inlines whatever it is given — so an
  # env-less build bakes in empty strings, `src/lib/supabase.js` throws
  # "Missing environment variables" in the browser, and the deploy still reports
  # success. That has taken production down twice.
  #
  # Two things can invoke it, and both are now blocked:
  #
  #   1. `netlify deploy` RUNS THIS BY DEFAULT — it is not a passive setting.
  #      That is what caused the second outage: the CLI re-ran `npm run build`
  #      inside the runner, with only NETLIFY_AUTH_TOKEN/NETLIFY_SITE_ID in
  #      scope, and overwrote the good dist just before uploading it.
  #      `npm run deploy:prod` therefore passes --no-build. Do not remove it.
  #   2. A Netlify-side git build, if continuous deployment is switched back on
  #      in the dashboard ("Stopped builds" is a toggle, not a guarantee).
  #
  # Failing loudly beats shipping a white screen that deploys green, so this
  # exits 1 rather than building. It does NOT affect `npm run build` locally or
  # in CI — that is `vite build`, not this. The redirects and headers below still
  # apply to every deploy.
  command = "echo 'Netlify must not build this site. Deploys come from .github/workflows/ci.yml — see OPERATIONS.md. If you hit this from the CLI, --no-build is missing.' && exit 1"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache content-hashed assets (Vite emits `index-<hash>.js` style filenames
# under /assets/ — safe to cache forever).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must stay revalidated on every visit so deploys propagate
# immediately (the hashed asset URLs inside it are what changes on each build).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Security headers — apply to every response.
#
# connect-src includes one Sentry ingest host (ADR-0008). It is the exact
# project host from VITE_SENTRY_DSN, not a wildcard, so a stolen or swapped DSN
# cannot redirect error payloads somewhere else. This file cannot read the env
# var, so the two are coupled by hand: if the DSN is ever repointed at a
# different Sentry project, this host must change with it or reporting silently
# stops.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options     = "nosniff"
    X-Frame-Options            = "DENY"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy    = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://o4511869055074304.ingest.de.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
