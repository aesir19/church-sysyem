name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails only on error-level rules. The vue/ and js/ recommended sets are
      # reported as warnings: 15,000 lines had never been linted and that backlog
      # must not gate unrelated work. The one rule that gates CI is
      # write-seam/writes-through-seam.
      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build app
        run: npm run build

  e2e:
    name: E2E (staging gate)
    runs-on: ubuntu-latest
    # Gate merges INTO staging only. Staging is where everything is fixed before
    # it reaches production, so the heavier headless-browser run guards that
    # integration point; feature-branch PRs and pushes still get the fast unit
    # suite without paying for a browser. The suite mocks every network call
    # (tests/e2e/support/mockSupabase.js) and serves the app under --mode test
    # with the committed .env.test, so this job needs no secrets.
    if: github.event_name == 'pull_request' && github.base_ref == 'staging'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the browser binary across runs. Keyed on the lockfile so a
      # Playwright version bump busts it. A cache hit still runs the install
      # step, which then only wires up OS deps rather than downloading Chromium.
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Chromium's binary only — NOT `--with-deps`. `--with-deps` shells out to
      # apt-get for system libraries, and GitHub's Ubuntu mirrors intermittently
      # stall there: one run hung ~16 min before being cancelled, and a bounded
      # retry only deadlocked (a killed apt-get orphaned the /var/lib/apt lock).
      # GitHub's ubuntu-latest image already ships Chromium's runtime libraries,
      # so the apt step is redundant here; the binary comes from Playwright's CDN
      # and is served from the actions/cache above. If a future Chromium ever needs
      # a lib the image lacks, move this whole job onto the mcr.microsoft.com/
      # playwright container rather than reintroducing apt on the runner.
      - name: Install Playwright (Chromium)
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npm run test:e2e

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # src/lib/supabase.js throws at module-evaluation time when these are
      # missing, and Vite bakes VITE_* in at build time — without them every
      # audited route renders a blank page and tanks all four categories for
      # reasons unrelated to performance. These are throwaway placeholders, not
      # secrets: the anon key is safe to publish by design (RLS is the control),
      # and nothing in this job talks to a real Supabase project.
      # VITE_SENTRY_DSN is deliberately left unset here — main.js skips
      # Sentry.init() when it's empty, so this build's placeholder-driven
      # errors never get reported into the real Sentry project.
      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-lighthouse-build

      - name: Run Lighthouse CI
        run: npm run lighthouse

  migrate:
    name: Deploy Prisma migrations to production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    # Overrides the workflow-level concurrency group above: a migration must
    # queue behind a prior one, never be cancelled mid-flight by a newer push
    # the way test/lighthouse correctly are.
    concurrency:
      group: prod-migrate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `prisma:migrate:run:deploy`, NOT `prisma:migrate:deploy`. The latter is
      # the local developer command and force-loads .env.staging — pointing this
      # job at it would either fail (no such file in CI) or, worse, migrate the
      # wrong database. The `:run:` variants take their credentials from the
      # ambient environment, which is what the secrets below provide.
      # Still goes through prisma:check:migrate, which fails fast on a missing
      # DIRECT_URL or an unencoded @ in the credentials.
      - name: Deploy migrations
        run: npm run prisma:migrate:run:deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}

  deploy:
    name: Deploy to Netlify (production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The actual ordering guarantee: GitHub Actions' own dependency graph, not
    # a Netlify setting. Netlify has no native "wait for external CI" feature
    # (verified against its docs — the only related toggle, "Stop builds", is
    # a manual global on/off switch, not conditional). So Netlify's git-based
    # auto-deploy is disabled entirely (Site configuration > Build & deploy >
    # Continuous deployment > Build settings > "Stopped builds"), and this job
    # is the only thing that publishes to production — only after test,
    # lighthouse, AND the migration have all succeeded.
    needs: [test, lighthouse, migrate]
    environment: production
    # Overrides the workflow-level concurrency group, same reasoning as
    # `migrate` above: without this, `deploy` shares ci-${{ github.ref }} with
    # cancel-in-progress: true, so a second rapid push to main could cancel an
    # in-flight deploy AFTER migrate already succeeded — production ends up
    # migrated with the previous frontend still live. Queue instead.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Repository VARIABLES, not secrets: the anon key is designed to be
      # public (RLS is the actual access control, not key secrecy), so a
      # GitHub Actions "Variable" (Settings > Secrets and variables > Actions >
      # Variables tab — distinct from Secrets) is the right home. Rotation or
      # repointing to a different Supabase project becomes "edit one
      # variable," not "edit this workflow file."
      # A `vars.*` reference to a variable that doesn't exist expands to an
      # empty string, and Vite bakes whatever it's given into the bundle — so a
      # missing or malformed value builds cleanly and white-screens in the
      # browser. This turns that into a failed build instead of a failed site.
      - name: Verify production build inputs
        run: node scripts/ci/check-build-env.js
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

      # `netlify-cli` is deliberately NOT a devDependency: it pulls in
      # @netlify/otel, whose @opentelemetry/api requirement conflicts with
      # vitest's peer dependency. It's only ever needed transiently here, so
      # `npx` runs it in an isolated environment per invocation instead —
      # `npm run deploy:prod` does the same locally if a manual deploy is
      # ever needed for recovery.
      - name: Deploy to Netlify
        run: npm run deploy:prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
